<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>BC Games</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0b0f14;
    color: #dfe7ef;
    min-height: 100vh;
    padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { color: #9aa8b5; line-height: 1.45; }
  ul { list-style: none; padding: 0; margin: 24px 0 0; }
  a {
    display: block;
    padding: 16px 18px;
    margin: 0 0 12px;
    background: #121a23;
    border: 1px solid #243140;
    border-radius: 12px;
    color: #dfe7ef;
    text-decoration: none;
    min-height: 44px;
  }
  a:hover, a:focus { border-color: #3d9cf0; }
  b { display: block; font-size: 1.1rem; }
  span { display: block; color: #9aa8b5; font-size: 0.92rem; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>BC Games</h1>
  <p>Playable web builds. Open a game, then tap once to start.</p>
  <ul>
    <li><a href="holding/"><b>HOLDING</b><span>Company tycoon</span></a></li>
    <li><a href="claim/"><b>CLAIM</b><span>Tile conquest strategy</span></a></li>
    <li><a href="slip/"><b>SLIP</b><span>Arcade run</span></a></li>
    <li><a href="gravity/"><b>GRAVITY</b><span>Puzzle</span></a></li>
    <li><a href="ash/"><b>ASH</b><span>Turn-based boss rush</span></a></li>
  </ul>
</main>
</body>
</html>
